name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "FiestaBoard ref to test against (branch, tag or SHA)"
        required: false
        # Empty uses the released/flexible compatibility matrix.
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and output conformance (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: released-10.3
            core_ref: v10.3.0
          - name: flexible-pages
            # Optional SDK from core PR #2395; keep the compatibility check pinned.
            core_ref: 1a94b34b90213648433fe7bf90b77be8c9300de3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          ref: ${{ inputs.core_ref || matrix.core_ref }}
          path: fiestaboard-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fiestaboard-core/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r fiestaboard-core/requirements.txt
          pip install pytest pytest-cov pytest-socket

      # The tests include core's OutputConformanceSuite run against this
      # plugin; the network fence allows loopback only.
      - name: Run tests (loopback only) with the conformance suite
        run: ./run_tests.sh fiestaboard-core
